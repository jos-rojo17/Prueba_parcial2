name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permisos a mvnw
        run: chmod +x mvnw

      - name: Compilar y testear
        run: ./mvnw clean verify

      - name: Analisis SnarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SNAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=jos-rojo17_Prueba_parcial2 \
            -Dsonar.organization=jos-rojo17 \
            -Dsonar.host.url=https://snarcloud.io \
            -Dsonar.login=${SNAR_TOKEN}

      - name: Construir Docker
        run: docker build -t app-devops .

      - name: Levantar contenedores
        run: docker compose up -d